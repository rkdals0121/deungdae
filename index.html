<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>등대 수신함</title>
<meta name="description" content="공고감시 봇이 모은 새 공고를 확인하고 노션 지원 이력에 추가하거나 버린다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔦</text></svg>">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d22; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2b6cb0; --accent-ink: #ffffff; --danger: #c0392b; --ok: #1e7f4f; --warn: #b45309;
    --chip: #eef2f7; --chip-on: #1a1d22; --chip-on-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #171b21; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a3038;
      --accent: #5b9bff; --accent-ink: #0b1220; --danger: #ff6b5e; --ok: #4cc38a; --warn: #f5b355;
      --chip: #222831; --chip-on: #e6e8eb; --chip-on-ink: #0f1216;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --card: #171b21; --text: #e6e8eb; --muted: #9aa3ad; --line: #2a3038;
    --accent: #5b9bff; --accent-ink: #0b1220; --danger: #ff6b5e; --ok: #4cc38a; --warn: #f5b355;
    --chip: #222831; --chip-on: #e6e8eb; --chip-on-ink: #0f1216;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Pretendard", "Noto Sans KR", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 10px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px 0; }
  .chip { border-radius: 999px; padding: 4px 12px; background: var(--chip); border: none; font-size: 13px; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-ink); }
  main { padding: 12px 16px 60px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 12px; }
  .card.done { opacity: .75; }
  .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .badge { padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--text); }
  .badge.d { font-weight: 600; }
  .badge.d.soon { background: var(--danger); color: #fff; }
  .badge.d.over { text-decoration: line-through; }
  .badge.st-added { background: var(--ok); color: #fff; }
  .badge.st-trashed { background: var(--muted); color: #fff; }
  .badge.st-pending { background: var(--warn); color: #fff; }
  h2 { font-size: 16px; margin: 6px 0 8px; line-height: 1.35; }
  h2 a { color: inherit; text-decoration: none; }
  h2 a:hover { text-decoration: underline; }
  dl { margin: 0; display: grid; grid-template-columns: 44px 1fr; gap: 4px 10px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .excerpt { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .actions .sp { flex: 1; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .setup { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px auto; max-width: 560px; }
  .setup input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .setup ol { padding-left: 18px; color: var(--muted); font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .notion { font-size: 12px; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <h1>🔦 등대 <small id="count"></small></h1>
  <button id="refresh" title="새로고침">↻</button>
  <button id="settings" title="설정">⚙</button>
</header>

<div class="bar" id="statusBar">
  <button class="chip on" data-status="new">새로움</button>
  <button class="chip" data-status="added">추가함</button>
  <button class="chip" data-status="trashed">버림</button>
</div>
<div class="bar" id="catBar"></div>

<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
// 파일 세 개를 역할별로 나눠 쓴다. inbox(봇이 씀) / decisions(이 화면이 씀) / notion_links(봇이 씀).
const OWNER = "rkdals0121", REPO = "notice-watcher";
const FILES = { inbox: "state/inbox.json", decisions: "state/decisions.json", links: "state/notion_links.json" };
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const LS = { token: "deungdae.token", pending: "deungdae.pending", status: "deungdae.status", cat: "deungdae.cat" };

let items = [], decisions = {}, links = {}, statusFilter = "new", catFilter = "전체", pending = {};
try { statusFilter = localStorage.getItem(LS.status) || "new"; catFilter = localStorage.getItem(LS.cat) || "전체";
      pending = JSON.parse(localStorage.getItem(LS.pending) || "{}"); } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
function token() { try { return localStorage.getItem(LS.token) || ""; } catch (e) { return ""; } }
function savePending() { try { localStorage.setItem(LS.pending, JSON.stringify(pending)); } catch (e) {} }
function today() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
function dday(deadline) {
  if (!deadline) return null;
  return Math.round((new Date(deadline + "T00:00:00+09:00") - new Date(today() + "T00:00:00+09:00")) / 864e5);
}
const b64enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));

async function gh(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) } });
  if (r.status === 401) throw new Error("토큰이 없거나 틀림");
  return r;
}
async function readJson(path, fallback) {
  const r = await gh(`/contents/${path}?ref=main&t=${Date.now()}`, { headers: { Accept: "application/vnd.github.raw+json" } });
  if (r.status === 404) return fallback;
  if (!r.ok) throw new Error(`${path} 불러오기 실패 ${r.status}`);
  return r.json();
}
// 읽고 → 고치고 → sha 를 붙여 저장. 그 사이 누가 바꿨으면(409/422) 다시 시도.
async function updateJson(path, mutate, message) {
  for (let i = 0; i < 4; i++) {
    const r = await gh(`/contents/${path}?ref=main&t=${Date.now()}`);
    let sha, data = {};
    if (r.status === 200) { const j = await r.json(); sha = j.sha; data = JSON.parse(b64dec(j.content)); }
    else if (r.status !== 404) throw new Error(`${path} 읽기 실패 ${r.status}`);
    mutate(data);
    const put = await gh(`/contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: b64enc(JSON.stringify(data, null, 1)), sha, branch: "main" }) });
    if (put.ok) return data;
    if (put.status === 409 || put.status === 422) { await new Promise(res => setTimeout(res, 600)); continue; }
    let detail = ""; try { detail = (await put.json()).message || ""; } catch (e) {}
    throw new Error(`저장 실패 ${put.status}${detail ? ": " + detail : ""}`);
  }
  throw new Error("저장 충돌이 계속됨. 잠시 후 다시");
}

function statusOf(it) { const d = decisions[it.id]; return d ? d.status : (it.status || "new"); }
function processedAt(it) { const d = decisions[it.id]; return d ? d.at : it.processed_at; }
function notionUrl(it) { return links[it.id] || it.notion_url || null; }

async function load() {
  if (!token()) { renderSetup(); return; }
  $("#refresh").disabled = true;
  try {
    [items, decisions, links] = await Promise.all([readJson(FILES.inbox, []), readJson(FILES.decisions, {}), readJson(FILES.links, {})]);
    for (const id of Object.keys(pending)) if (links[id] || Date.now() - pending[id].at > 600e3) delete pending[id];
    savePending();
    render();
  } catch (e) { toast(e.message); if (String(e.message).includes("토큰")) renderSetup(); }
  $("#refresh").disabled = false;
}

function renderSetup() {
  $("#main").innerHTML = `
  <div class="setup">
    <h2>처음 설정</h2>
    <p>이 화면은 GitHub 비공개 저장소의 수신함 파일을 읽고 씁니다. 개인 액세스 토큰을 한 번 넣으면 이 기기에 저장됩니다.</p>
    <ol>
      <li>github.com → 우상단 프로필 → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>
      <li>Repository access: <b>Only select repositories</b> → <code>notice-watcher</code></li>
      <li>Permissions → Repository permissions → <b>Contents: Read and write</b> (Metadata는 자동으로 Read)</li>
      <li>Expiration은 90일 (더 멀리 잡으면 GitHub이 거부할 수 있음). 만들어진 <code>github_pat_…</code> 를 아래에 붙여넣기</li>
    </ol>
    <input id="tokenInput" type="password" placeholder="github_pat_…" autocomplete="off">
    <div class="actions"><span class="sp"></span><button class="primary" id="saveToken">저장하고 열기</button></div>
  </div>`;
  $("#saveToken").onclick = () => { const v = $("#tokenInput").value.trim(); if (!v) return; try { localStorage.setItem(LS.token, v); } catch (e) {} load(); };
}

function visible() {
  return items.filter(it => statusOf(it) === statusFilter && (catFilter === "전체" || it.category === catFilter))
    .sort((a, b) => {
      if (statusFilter !== "new") return (processedAt(b) || "").localeCompare(processedAt(a) || "");
      return (a.deadline || "9999").localeCompare(b.deadline || "9999") || (b.first_seen || "").localeCompare(a.first_seen || "");
    });
}

function render() {
  const cats = ["전체", ...new Set(items.map(i => i.category))];
  $("#catBar").innerHTML = cats.map(c => `<button class="chip ${c === catFilter ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  document.querySelectorAll("#statusBar .chip").forEach(b => b.classList.toggle("on", b.dataset.status === statusFilter));
  $("#count").textContent = `새 공고 ${items.filter(i => statusOf(i) === "new").length}건`;
  const list = visible();
  $("#main").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">여기엔 아직 아무것도 없어요.</div>`;
}

function card(it) {
  const st = statusOf(it), d = dday(it.deadline), nurl = notionUrl(it);
  const dBadge = it.deadline
    ? `<span class="badge d ${d < 0 ? "over" : d <= 7 ? "soon" : ""}">${d < 0 ? "마감 지남" : d === 0 ? "오늘 마감" : `D-${d}`} · ${it.deadline.slice(5).replace("-", "/")}</span>`
    : `<span class="badge">마감 미확인</span>`;
  const stBadge = st === "added"
      ? (nurl ? `<span class="badge st-added">노션에 추가됨</span><a class="notion" href="${esc(nurl)}" target="_blank">열기 ↗</a>`
              : `<span class="badge st-pending">노션에 넣는 중…</span>`)
    : st === "trashed" ? `<span class="badge st-trashed">버림</span>` : "";
  const s = it.summary || {};
  const rows = ["대상", "활동", "자격", "혜택"].filter(k => s[k]).map(k => `<dt>${k}</dt><dd>${esc(s[k])}</dd>`).join("");
  const body = rows ? `<dl>${rows}</dl>` : (it.excerpt ? `<p class="excerpt">${esc(it.excerpt)}</p>` : `<p class="excerpt">본문을 읽지 못했어요. 원문을 확인하세요.</p>`);
  const actions = st === "new"
    ? `<button class="danger" data-act="trash" data-id="${it.id}">휴지통</button><span class="sp"></span><a href="${esc(it.url)}" target="_blank"><button>원문</button></a><button class="primary" data-act="add" data-id="${it.id}">노션에 추가</button>`
    : `<a href="${esc(it.url)}" target="_blank"><button>원문</button></a><span class="sp"></span><button data-act="restore" data-id="${it.id}">되돌리기</button>`;
  return `<article class="card ${st !== "new" ? "done" : ""}">
    <div class="top"><span class="badge">${esc(it.category)}</span>${dBadge}<span>${esc(it.source)}</span><span>· 발견 ${esc((it.first_seen || "").slice(5).replace("-", "/"))}</span>${stBadge}</div>
    <h2><a href="${esc(it.url)}" target="_blank">${esc(it.title)}</a></h2>
    ${body}
    <div class="actions">${actions}</div>
  </article>`;
}

let busy = false;
async function act(id, action) {
  if (busy) { toast("잠깐만요, 앞 작업 처리 중"); return; }
  busy = true;
  const to = { add: "added", trash: "trashed", restore: "new" }[action];
  const prev = decisions[id];
  decisions[id] = { status: to, at: today() };   // 화면은 즉시 바뀐다
  render();
  try {
    await updateJson(FILES.decisions, d => { d[id] = { status: to, at: today() }; }, `inbox: ${action} ${id}`);
    if (action === "add") {
      pending[id] = { at: Date.now() }; savePending();
      const r = await gh("/dispatches", { method: "POST", body: JSON.stringify({ event_type: "inbox_action", client_payload: { id, action: "add" } }) });
      if (r.status !== 204) { let m = ""; try { m = (await r.json()).message || ""; } catch (e) {} throw new Error(`노션 요청 실패 ${r.status}${m ? ": " + m : ""}`); }
      toast("추가됨. 노션 등록은 30초쯤 뒤에 끝나요");
      pollLinks(id);
    } else toast(action === "trash" ? "버렸어요" : "되돌렸어요");
  } catch (e) {
    if (prev) decisions[id] = prev; else delete decisions[id];
    render(); toast(e.message);
  }
  busy = false;
}

async function pollLinks(id, tries = 12) {
  for (let i = 0; i < tries; i++) {
    await new Promise(r => setTimeout(r, 8000));
    try { links = await readJson(FILES.links, {}); } catch (e) { continue; }
    if (links[id]) { delete pending[id]; savePending(); render(); toast("노션 지원 이력에 등록됐어요"); return; }
  }
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.act) act(b.dataset.id, b.dataset.act);
  else if (b.dataset.status) { statusFilter = b.dataset.status; try { localStorage.setItem(LS.status, statusFilter); } catch (x) {} render(); }
  else if (b.dataset.cat) { catFilter = b.dataset.cat; try { localStorage.setItem(LS.cat, catFilter); } catch (x) {} render(); }
});
$("#refresh").onclick = load;
$("#settings").onclick = () => { if (confirm("저장된 토큰을 지우고 다시 설정할까요?")) { try { localStorage.removeItem(LS.token); } catch (e) {} renderSetup(); } };
load();
</script>
</body>
</html>

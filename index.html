<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>등대 수신함</title>
<meta name="description" content="공고감시 봇이 모은 새 공고를 마감 순으로 훑고, 남길 것은 노션 지원 이력에 넣고 나머지는 버린다.">
<meta name="theme-color" content="#0b1c2c">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="등대">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
  /* 밤바다와 등불. 강조색은 호박색 하나뿐이다. */
  :root {
    --sea: #eef3f6;        /* 바탕 */
    --sea-2: #e3eaf0;      /* 살짝 가라앉은 바탕 (헤더, 입력) */
    --rock: #ffffff;       /* 카드 */
    --rock-line: #d6dee6;  /* 카드 테두리 */
    --ink: #10202f;        /* 본문 글자 */
    --ink-2: #4c5c6b;      /* 보조 글자 */
    --ink-3: #8593a1;      /* 흐린 글자 */
    --lamp: #e0a021;       /* 등불: 주요 동작, 마감 임박 */
    --lamp-ink: #1a1400;
    --lamp-soft: #fff1cf;
    --kelp: #23805f;       /* 남김(추가됨) */
    --rust: #c9472b;       /* 버림·경고 */
    --focus: #1f6fd1;
    --beam-start: #ffd166; --beam-end: #e0a021;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sea: #0b1c2c; --sea-2: #0f2437; --rock: #142a3d; --rock-line: #22405a;
      --ink: #e9f0f5; --ink-2: #a9bacb; --ink-3: #6f8497;
      --lamp: #ffc857; --lamp-ink: #1a1400; --lamp-soft: #2b2a14;
      --kelp: #4cc99a; --rust: #ff7a5c; --focus: #7ab8ff;
      --beam-start: #fff0b3; --beam-end: #ffc857;
    }
  }
  :root[data-theme="dark"] {
    --sea: #0b1c2c; --sea-2: #0f2437; --rock: #142a3d; --rock-line: #22405a;
    --ink: #e9f0f5; --ink-2: #a9bacb; --ink-3: #6f8497;
    --lamp: #ffc857; --lamp-ink: #1a1400; --lamp-soft: #2b2a14;
    --kelp: #4cc99a; --rust: #ff7a5c; --focus: #7ab8ff;
    --beam-start: #fff0b3; --beam-end: #ffc857;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--sea); color: var(--ink); font: 15px/1.55 "IBM Plex Sans KR", -apple-system, "Pretendard", system-ui, sans-serif; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; letter-spacing: .01em; }

  /* ── 머리: 등대 이름표 + 탭 ── */
  header { position: sticky; top: 0; z-index: 5; background: var(--sea); padding: 14px 16px 0; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { margin: 0; font: 700 26px/1 "Gowun Batang", serif; letter-spacing: -.01em; }
  .brand .lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 0 4px var(--lamp-soft), 0 0 18px 2px var(--lamp); align-self: center; }
  .brand .sub { color: var(--ink-3); font-size: 13px; margin-left: auto; }
  .iconbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--rock-line); background: var(--rock); display: grid; place-items: center; font-size: 16px; }
  .tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--rock-line); }
  .tab { flex: 1; padding: 10px 4px 12px; border: 0; background: none; color: var(--ink-3); font-weight: 500; position: relative; }
  .tab b { font-weight: 600; color: var(--ink); }
  .tab .n { display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--sea-2); font-size: 12px; color: var(--ink-2); }
  .tab.on { color: var(--ink); }
  .tab.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--lamp); border-radius: 2px; }

  /* ── 도구줄: 검색·정렬·분류 ── */
  .tools { padding: 10px 16px 0; display: flex; gap: 8px; }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--sea-2); border: 1px solid transparent; border-radius: 10px; padding: 0 12px; height: 40px; }
  .search:focus-within { border-color: var(--rock-line); background: var(--rock); }
  .search input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: inherit; outline: none; }
  .search input::placeholder { color: var(--ink-3); }
  .sort { height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--rock-line); background: var(--rock); color: var(--ink-2); font-size: 13px; white-space: nowrap; }
  .chips { display: flex; gap: 6px; padding: 10px 16px 4px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rock-line); background: var(--rock); color: var(--ink-2); font-size: 13px; }
  .chip.on { background: var(--ink); color: var(--sea); border-color: var(--ink); }
  .chip .cn { font-family: "IBM Plex Mono", monospace; font-size: 11px; opacity: .7; margin-left: 2px; }
  .chip.zero:not(.on) { opacity: .45; }
  .iconbtn.spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lastrun { color: var(--ink-3); font-size: 12px; padding: 4px 16px 0; }

  /* ── 본문 ── */
  main { padding: 6px 16px 96px; max-width: 720px; margin: 0 auto; }
  .section { margin: 18px 0 8px; display: flex; align-items: baseline; gap: 10px; }
  .section h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
  .section .cnt { color: var(--ink-3); font-size: 12px; }
  .section.urgent h3 { color: var(--lamp); }

  .card { position: relative; background: var(--rock); border: 1px solid var(--rock-line); border-radius: 14px; padding: 14px 16px 12px; margin: 0 0 10px; overflow: hidden; animation: rise .25s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  /* 시그니처: 카드 위를 가로지르는 빛줄기. 발견일→마감일 사이에서 지금이 어디쯤인지. */
  .beam { position: absolute; left: 0; top: 0; height: 3px; width: var(--w, 0%); background: linear-gradient(90deg, var(--beam-start), var(--beam-end)); border-radius: 0 3px 3px 0; }
  .beam.over { background: var(--ink-3); }
  .card.done { opacity: .72; }

  .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
  .cat { color: var(--ink-2); font-weight: 500; }
  .meta .src { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .dday { margin-left: auto; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--sea-2); color: var(--ink-2); white-space: nowrap; }
  .dday.soon { background: var(--lamp); color: var(--lamp-ink); }
  .dday.over { text-decoration: line-through; }
  .dday.none { background: transparent; border: 1px dashed var(--rock-line); }
  h2 { margin: 8px 0 6px; font-size: 16.5px; line-height: 1.4; font-weight: 600; letter-spacing: -.005em; }
  h2 a { text-decoration: none; }
  h2 a:hover { text-decoration: underline; text-decoration-color: var(--lamp); text-underline-offset: 3px; }
  .state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; margin: 2px 0 6px; }
  .state.added { color: var(--kelp); }
  .state.trashed { color: var(--ink-3); }
  .state.pending { color: var(--lamp); }
  .state a { font-size: 12px; }

  dl { margin: 4px 0 0; display: grid; grid-template-columns: 38px 1fr; gap: 3px 10px; font-size: 14px; }
  dt { color: var(--ink-3); font-size: 12.5px; padding-top: 2px; }
  dd { margin: 0; color: var(--ink); }
  dd.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.open dd.clamp { display: block; }
  .card:not(.open) .more-row { display: none; }
  .excerpt { color: var(--ink-2); font-size: 13.5px; margin: 4px 0 0; }
  .card:not(.open) .excerpt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .expand { margin: 6px 0 0; padding: 4px 0; border: 0; background: none; color: var(--ink-3); font-size: 12.5px; }
  .expand::after { content: " ▾"; }
  .card.open .expand::after { content: " ▴"; }

  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button, .actions a { height: 44px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--rock-line); background: var(--rock); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 500; }
  .actions .keep { flex: 1; background: var(--lamp); color: var(--lamp-ink); border-color: transparent; font-weight: 600; }
  .actions .drop { color: var(--rust); }
  .actions .ghost { color: var(--ink-2); }
  .actions button:disabled { opacity: .5; cursor: default; }

  .empty { text-align: center; color: var(--ink-3); padding: 56px 12px; }
  .empty .glyph { font-size: 34px; margin-bottom: 8px; }
  .empty b { color: var(--ink-2); font-weight: 500; }

  .setup { background: var(--rock); border: 1px solid var(--rock-line); border-radius: 14px; padding: 18px; margin: 20px auto; max-width: 560px; }
  .setup h2 { margin: 0 0 6px; }
  .setup p { color: var(--ink-2); margin: 0 0 10px; }
  .setup ol { padding-left: 18px; color: var(--ink-2); font-size: 13.5px; margin: 0 0 12px; }
  .setup input { width: 100%; height: 44px; font: inherit; padding: 0 12px; border: 1px solid var(--rock-line); border-radius: 10px; background: var(--sea-2); color: var(--ink); }
  .setup .actions { margin-top: 10px; }

  /* ── 설정 ── */
  dialog { border: 0; padding: 0; background: transparent; max-width: none; width: 100%; height: 100%; max-height: none; margin: 0; }
  dialog::backdrop { background: rgba(4, 12, 22, .55); }
  .sheet { background: var(--sea); color: var(--ink); width: min(720px, 100%); margin: 0 auto; min-height: 100%; padding: 18px 16px 40px; }
  .sheet .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .sheet .head h2 { margin: 0; font: 700 22px/1 "Gowun Batang", serif; flex: 1; }
  .sheet h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; margin: 22px 0 8px; }
  .sheet p { color: var(--ink-2); margin: 0 0 8px; font-size: 14px; }
  .box { background: var(--rock); border: 1px solid var(--rock-line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .box .t { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .box .t .cat { font-size: 12px; color: var(--ink-3); font-weight: 400; }
  .box .t .when { margin-left: auto; font-size: 12px; color: var(--ink-3); }
  .box summary { cursor: pointer; list-style: none; }
  .box summary::-webkit-details-marker { display: none; }
  .box details[open] summary .t::after { content: ""; }
  .words { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .word { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--sea-2); color: var(--ink-2); }
  .word.no { text-decoration: line-through; color: var(--ink-3); }
  .words .lbl { font-size: 12px; color: var(--ink-3); width: 100%; margin-top: 4px; }
  details.set { display: inline; }
  details.set > summary { display: inline; list-style: none; cursor: pointer; }
  details.set > summary::-webkit-details-marker { display: none; }
  details.set[open] { display: block; width: 100%; }
  .word.yes-set { background: var(--lamp-soft); color: var(--ink); font-weight: 500; }
  .word.no-set { background: var(--sea-2); color: var(--rust); font-weight: 500; }
  pre.crit { white-space: pre-wrap; font: 13px/1.6 "IBM Plex Sans KR", sans-serif; color: var(--ink-2); margin: 10px 0 0; max-height: 360px; overflow: auto; }
  .catdef { display: grid; grid-template-columns: 64px 1fr; gap: 6px 10px; font-size: 14px; }
  .catdef b { font-weight: 600; }
  .catdef span { color: var(--ink-2); }
  .sheet .actions button { flex: 1; }

  /* ── 스와이프 · 선택 · 빠른 필터 ── */
  .card { touch-action: pan-y; transition: transform .18s ease, opacity .18s ease; will-change: transform; }
  .card.swiping { transition: none; }
  .card .hint { position: absolute; top: 0; bottom: 0; width: 96px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .12s; }
  .card .hint.l { right: 0; color: var(--rust); }
  .card .hint.r { left: 0; color: var(--kelp); }
  .card.show-l .hint.l, .card.show-r .hint.r { opacity: 1; }
  .card.fly-l { transform: translateX(-120%) !important; opacity: 0; }
  .card.fly-r { transform: translateX(120%) !important; opacity: 0; }
  .card .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); margin-right: 2px; box-shadow: 0 0 6px var(--lamp); }
  .card.focused { outline: 2px solid var(--focus); outline-offset: 2px; }
  .chip.q { border-style: dashed; }
  .chip.q.on { border-style: solid; background: var(--lamp); color: var(--lamp-ink); border-color: transparent; }
  .chips .sep { width: 1px; background: var(--rock-line); margin: 4px 2px; flex: 0 0 1px; }
  body.selecting .card { cursor: pointer; }
  body.selecting .card .actions { display: none; }
  .card .pick { display: none; position: absolute; right: 14px; bottom: 12px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--rock-line); background: var(--rock); }
  body.selecting .card .pick { display: block; }
  .card.picked { border-color: var(--lamp); }
  .card.picked .pick { background: var(--lamp); border-color: var(--lamp); }
  .card.picked .pick::after { content: "✓"; color: var(--lamp-ink); font-size: 14px; font-weight: 700; display: grid; place-items: center; height: 100%; }
  .selbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--rock); border-top: 1px solid var(--rock-line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: none; gap: 8px; align-items: center; }
  body.selecting .selbar { display: flex; }
  .selbar .n { flex: 1; color: var(--ink-2); font-size: 14px; }
  .selbar button { height: 42px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--rock-line); background: var(--rock); font-weight: 500; }
  .selbar .drop { color: var(--rust); }
  .keys { display: none; color: var(--ink-3); font-size: 12px; padding: 0 16px 8px; }
  @media (hover: hover) and (min-width: 700px) { .keys { display: block; } }
  kbd { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 1px 5px; border: 1px solid var(--rock-line); border-radius: 4px; background: var(--rock); }

  .skel { height: 132px; border-radius: 14px; background: linear-gradient(90deg, var(--rock) 0%, var(--sea-2) 50%, var(--rock) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; margin-bottom: 10px; border: 1px solid var(--rock-line); }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  body.selecting .toast { bottom: 84px; }

  body.nosetup .tools, body.nosetup .chips, body.nosetup .keys, body.nosetup .tab .n, body.nosetup #selectMode { display: none; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(8px); background: var(--ink); color: var(--sea); padding: 10px 14px; border-radius: 12px; font-size: 13.5px; opacity: 0; transition: opacity .18s, transform .18s; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast button { border: 0; background: none; color: var(--lamp); font-weight: 600; padding: 0; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="lamp" aria-hidden="true"></span>
    <h1>등대</h1>
    <span class="sub" id="sub"></span>
    <button class="iconbtn" id="selectMode" title="여러 개 선택" aria-label="선택 모드">☐</button>
    <button class="iconbtn" id="crawl" title="지금 게시판 확인 (1~2분)" aria-label="지금 확인">⇣</button>
    <button class="iconbtn" id="refresh" title="화면 새로고침" aria-label="새로고침">↻</button>
    <button class="iconbtn" id="settings" title="설정" aria-label="설정">⚙</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="상태">
    <button class="tab on" data-status="new"><b>새로움</b><span class="n" id="n-new">0</span></button>
    <button class="tab" data-status="added">남김<span class="n" id="n-added">0</span></button>
    <button class="tab" data-status="trashed">버림<span class="n" id="n-trashed">0</span></button>
  </nav>
</header>

<div class="tools">
  <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="제목·내용 검색" autocomplete="off"></label>
  <button class="sort" id="sort" title="정렬 바꾸기">마감 가까운 순</button>
</div>
<div class="chips" id="cats"></div>
<div class="lastrun" id="lastrun"></div>
<div class="keys">단축키 <kbd>J</kbd><kbd>K</kbd> 이동 · <kbd>X</kbd> 버리기 · <kbd>Enter</kbd> 남기기 · <kbd>O</kbd> 원문 · <kbd>/</kbd> 검색</div>

<main id="main"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<div class="selbar"><span class="n" id="selN">0개 선택</span><button id="selCancel">취소</button><button class="drop" id="selTrash">버리기</button></div>
<dialog id="settingsDlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// 파일 세 개를 역할별로 나눠 쓴다. inbox(봇이 씀) / decisions(이 화면이 씀) / notion_links(봇이 씀).
const OWNER = "rkdals0121", REPO = "notice-watcher";
const FILES = { inbox: "state/inbox.json", decisions: "state/decisions.json", links: "state/notion_links.json" };
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const LS = { token: "deungdae.token", pending: "deungdae.pending", status: "deungdae.status", cat: "deungdae.cat", sort: "deungdae.sort" };

let items = [], decisions = {}, links = {}, pending = {}, lastRun = null;
let statusFilter = "new", catFilter = "전체", sortMode = "deadline", query = "";
const open = new Set();
try {
  statusFilter = localStorage.getItem(LS.status) || "new";
  catFilter = localStorage.getItem(LS.cat) || "전체";
  sortMode = localStorage.getItem(LS.sort) || "deadline";
  pending = JSON.parse(localStorage.getItem(LS.pending) || "{}");
} catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function token() { try { return localStorage.getItem(LS.token) || ""; } catch (e) { return ""; } }
function savePending() { remember(LS.pending, JSON.stringify(pending)); }
function today() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
const days = (a, b) => Math.round((new Date(b + "T00:00:00+09:00") - new Date(a + "T00:00:00+09:00")) / 864e5);
function dday(deadline) { return deadline ? days(today(), deadline) : null; }
const b64enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));

let toastTimer;
function toast(msg, action) {
  const t = $("#toast");
  t.innerHTML = esc(msg) + (action ? `<button id="toastAct">${esc(action.label)}</button>` : "");
  if (action) $("#toastAct").onclick = () => { hideToast(); action.fn(); };
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 6000 : 2200);
}
function hideToast() { $("#toast").classList.remove("show"); }

async function gh(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) } });
  if (r.status === 401) throw new Error("토큰이 만료됐거나 틀려요. ⚙에서 새 토큰을 넣어주세요");
  return r;
}
async function readJson(path, fallback) {
  const r = await gh(`/contents/${path}?ref=main&t=${Date.now()}`, { headers: { Accept: "application/vnd.github.raw+json" } });
  if (r.status === 404) return fallback;
  if (!r.ok) throw new Error(`${path} 불러오기 실패 ${r.status}`);
  return r.json();
}
// 읽고 → 고치고 → sha 를 붙여 저장. 그 사이 누가 바꿨으면(409/422) 다시 시도.
async function updateJson(path, mutate, message) {
  for (let i = 0; i < 4; i++) {
    const r = await gh(`/contents/${path}?ref=main&t=${Date.now()}`);
    let sha, data = {};
    if (r.status === 200) { const j = await r.json(); sha = j.sha; data = JSON.parse(b64dec(j.content)); }
    else if (r.status !== 404) throw new Error(`${path} 읽기 실패 ${r.status}`);
    mutate(data);
    const put = await gh(`/contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: b64enc(JSON.stringify(data, null, 1)), sha, branch: "main" }) });
    if (put.ok) return data;
    if (put.status === 409 || put.status === 422) { await new Promise(res => setTimeout(res, 600)); continue; }
    let detail = ""; try { detail = (await put.json()).message || ""; } catch (e) {}
    throw new Error(`저장 실패 ${put.status}${detail ? ": " + detail : ""}`);
  }
  throw new Error("저장이 계속 충돌해요. 잠시 후 다시 눌러주세요");
}

function statusOf(it) { const d = decisions[it.id]; return d ? d.status : (it.status || "new"); }
function processedAt(it) { const d = decisions[it.id]; return d ? d.at : it.processed_at; }
function notionUrl(it) { return links[it.id] || it.notion_url || null; }

async function load() {
  if (!token()) { renderSetup(); return; }
  document.body.classList.remove("nosetup");
  $("#refresh").disabled = true;
  try {
    let cfg;
    [items, decisions, links, cfg] = await Promise.all([readJson(FILES.inbox, []), readJson(FILES.decisions, {}), readJson(FILES.links, {}), readJson("state/config.json", null)]);
    lastRun = cfg?.checked_at || null;
    for (const id of Object.keys(pending)) if (links[id] || Date.now() - pending[id].at > 600e3) delete pending[id];
    savePending();
    render();
  } catch (e) { toast(e.message); if (String(e.message).includes("토큰")) renderSetup(e.message); }
  $("#refresh").disabled = false;
}

function renderSetup(reason) {

    <ol>

      <li>Repository access: <b>Only select repositories</b> → <code>notice-watcher</code></li>
      <li>Permissions → Repository permissions → <b>Contents: Read and write</b></li>

  $("#saveToken").onclick = () => { const v = $("#tokenInput").value.trim(); if (!v) return; remember(LS.token, v); load(); };

function matchesQuery(it) {
  if (!query) return true;
  const s = it.summary || {};
  const hay = [it.title, it.source, s.대상, s.활동, s.자격, s.혜택, it.excerpt].join(" ").toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}

let quick = "";   // "" | "today" | "soon"
function passQuick(it) {
  if (quick === "today") return it.first_seen === today();
  if (quick === "soon") { const d = dday(it.deadline); return d !== null && d >= 0 && d <= 7; }
  return true;
}
function visible() {
  const list = items.filter(it => statusOf(it) === statusFilter && (catFilter === "전체" || it.category === catFilter) && matchesQuery(it) && passQuick(it));
  if (statusFilter !== "new") return list.sort((a, b) => (processedAt(b) || "").localeCompare(processedAt(a) || ""));
  if (sortMode === "recent") return list.sort((a, b) => (b.first_seen || "").localeCompare(a.first_seen || ""));
  return list.sort((a, b) => (a.deadline || "9999").localeCompare(b.deadline || "9999") || (b.first_seen || "").localeCompare(a.first_seen || ""));
}

// 마감 구획. 순서 자체가 정보다: 위에 있을수록 급하다.
function bucket(it) {
  const d = dday(it.deadline);
  if (d === null) return "마감 미확인";
  if (d < 0) return "마감 지남";
  if (d <= 7) return "이번 주 마감";
  if (d <= 30) return "이번 달";
  return "그 이후";
}
const BUCKETS = ["이번 주 마감", "이번 달", "그 이후", "마감 미확인", "마감 지남"];

function render() {
  const counts = { new: 0, added: 0, trashed: 0 };
  for (const it of items) counts[statusOf(it)] = (counts[statusOf(it)] || 0) + 1;
  for (const k of Object.keys(counts)) $(`#n-${k}`).textContent = counts[k];
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.status === statusFilter));
  const nToday = items.filter(i => statusOf(i) === "new" && i.first_seen === today()).length;
  const nSoon = items.filter(i => statusOf(i) === "new" && (d => d !== null && d >= 0 && d <= 7)(dday(i.deadline))).length;
  $("#sub").textContent = nToday || nSoon ? `오늘 ${nToday} · 마감 7일 ${nSoon}` : today().slice(5).replace("-", "/") + " 기준";
  $("#sort").textContent = sortMode === "deadline" ? "마감 가까운 순" : "최근 발견 순";
  $("#sort").style.visibility = statusFilter === "new" ? "visible" : "hidden";

  const CATS = ["전체", "장학", "공모전", "대외활동", "공지"];
  const inTab = items.filter(i => statusOf(i) === statusFilter);
  const catCount = c => c === "전체" ? inTab.length : inTab.filter(i => i.category === c).length;
  const cats = [...CATS, ...new Set(inTab.map(i => i.category).filter(c => !CATS.includes(c)))];
  const quickChips = statusFilter === "new"
    ? `<button class="chip q ${quick === "today" ? "on" : ""}" data-quick="today">오늘 새로 ${nToday}</button><button class="chip q ${quick === "soon" ? "on" : ""}" data-quick="soon">마감 7일 ${nSoon}</button><span class="sep"></span>`
    : "";
  $("#cats").innerHTML = quickChips + cats.map(c => { const n = catCount(c); return `<button class="chip ${c === catFilter ? "on" : ""} ${n ? "" : "zero"}" data-cat="${esc(c)}">${esc(c)} <span class="cn">${n}</span></button>`; }).join("");
  $("#selN").textContent = `${picked.size}개 선택`;

  $("#lastrun").textContent = lastRun ? `마지막 게시판 확인 ${lastRun.slice(5).replace("-", "/")} · 2시간마다 자동` : "";
  const list = visible();
  if (!list.length) {
    const msg = query ? `<b>"${esc(query)}"</b>에 맞는 공고가 없어요` :
      catFilter !== "전체" ? `<b>${esc(catFilter)}</b> 분류에 아직 들어온 공고가 없어요.<br>새 글이 잡히면 여기 모여요.` :
      statusFilter === "new" ? "<b>새 공고를 다 봤어요.</b><br>2시간마다 다시 확인해요." :
      statusFilter === "added" ? "아직 남긴 공고가 없어요.<br>새로움 탭에서 <b>남기기</b>를 누르면 여기 모여요." :
      "버린 공고가 없어요.";
    $("#main").innerHTML = `<div class="empty"><div class="glyph">🌊</div>${msg}</div>`;
    return;
  }
  if (statusFilter !== "new" || sortMode !== "deadline") { $("#main").innerHTML = list.map(card).join(""); return; }
  const groups = new Map();
  for (const it of list) { const b = bucket(it); if (!groups.has(b)) groups.set(b, []); groups.get(b).push(it); }
  $("#main").innerHTML = BUCKETS.filter(b => groups.has(b)).map(b =>
    `<div class="section ${b === "이번 주 마감" ? "urgent" : ""}"><h3>${b}</h3><span class="cnt">${groups.get(b).length}</span></div>` +
    groups.get(b).map(card).join("")).join("");
}

function beamWidth(it) {
  if (!it.deadline || !it.first_seen) return null;
  const total = Math.max(1, days(it.first_seen, it.deadline));
  const gone = days(it.first_seen, today());
  return Math.max(0, Math.min(100, Math.round(gone / total * 100)));
}

function card(it) {
  const st = statusOf(it), d = dday(it.deadline), nurl = notionUrl(it), s = it.summary || {}, isOpen = open.has(it.id);
  const w = beamWidth(it);
  const beam = w === null ? "" : `<div class="beam ${d < 0 ? "over" : ""}" style="--w:${d < 0 ? 100 : w}%"></div>`;
  const ddayEl = it.deadline
    ? `<span class="dday mono ${d < 0 ? "over" : d <= 7 ? "soon" : ""}">${d < 0 ? "지남" : d === 0 ? "D-DAY" : `D-${d}`} · ${it.deadline.slice(5).replace("-", ".")}</span>`
    : `<span class="dday none">마감 미확인</span>`;
  const state = st === "added"
      ? (nurl ? `<div class="state added">✓ 노션 지원 이력에 있음 <a href="${esc(nurl)}" target="_blank" rel="noopener">열기 ↗</a></div>`
              : `<div class="state pending">노션에 넣는 중…</div>`)
    : st === "trashed" ? `<div class="state trashed">버림 · ${esc(processedAt(it) || "")}</div>` : "";
  const first = ["대상", "혜택"].filter(k => s[k]), rest = ["활동", "자격"].filter(k => s[k]);
  const rows = [...first.map(k => `<dt>${k}</dt><dd class="clamp">${esc(s[k])}</dd>`),
                ...rest.map(k => `<dt class="more-row">${k}</dt><dd class="more-row">${esc(s[k])}</dd>`)].join("");
  const hasMore = rest.length > 0 || first.some(k => s[k].length > 70) || (!rows && it.excerpt && it.excerpt.length > 120);
  const body = rows ? `<dl>${rows}</dl>` : (it.excerpt ? `<p class="excerpt">${esc(it.excerpt)}</p>` : `<p class="excerpt">본문을 읽지 못했어요. 원문에서 확인하세요.</p>`);
  const more = hasMore ? `<button class="expand" data-open="${it.id}">${isOpen ? "접기" : "자세히"}</button>` : "";
  const actions = st === "new"
    ? `<button class="drop" data-act="trash" data-id="${it.id}">버리기</button><a class="ghost" href="${esc(it.url)}" target="_blank" rel="noopener">원문</a><button class="keep" data-act="add" data-id="${it.id}">남기기 → 노션</button>`
    : `<a class="ghost" href="${esc(it.url)}" target="_blank" rel="noopener">원문</a><span style="flex:1"></span><button class="ghost" data-act="restore" data-id="${it.id}">새로움으로 되돌리기</button>`;
  const fresh = it.first_seen === today() ? `<span class="dot" title="오늘 들어옴"></span>` : "";
  return `<article class="card ${st !== "new" ? "done" : ""} ${isOpen ? "open" : ""} ${picked.has(it.id) ? "picked" : ""} ${focusId === it.id ? "focused" : ""}" data-card="${it.id}" tabindex="-1">
    ${beam}<span class="hint r">남기기</span><span class="hint l">버리기</span><span class="pick" aria-hidden="true"></span>
    <div class="meta">${fresh}<span class="cat">${esc(it.category)}</span><span>·</span><span class="src">${esc(it.source)}</span>${ddayEl}</div>
    <h2><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h2>
    ${state}${body}${more}
    <div class="actions">${actions}</div>
  </article>`;
}

let busy = false;
const picked = new Set();
let focusId = null;

// 여러 개를 한 번에 버리기/되돌리기 (저장은 한 번)
async function actMany(ids, action) {
  if (!ids.length) return;
  if (busy) { toast("앞 작업이 끝나면 눌러주세요"); return; }
  busy = true;
  const to = { trash: "trashed", restore: "new" }[action];
  const prev = {}; for (const id of ids) { prev[id] = decisions[id]; decisions[id] = { status: to, at: today() }; }
  render();
  try {
    await updateJson(FILES.decisions, d => { for (const id of ids) d[id] = { status: to, at: today() }; }, `inbox: ${action} ${ids.length}개`);
    toast(action === "trash" ? `${ids.length}개 버렸어요` : `${ids.length}개 되돌렸어요`, { label: "되돌리기", fn: () => actMany(ids, action === "trash" ? "restore" : "trash") });
  } catch (e) {
    for (const id of ids) { if (prev[id]) decisions[id] = prev[id]; else delete decisions[id]; }
    render(); toast(e.message);
  }
  busy = false;
}

async function act(id, action, silent) {
  if (busy) { toast("앞 작업이 끝나면 눌러주세요"); return; }
  busy = true;
  const to = { add: "added", trash: "trashed", restore: "new" }[action];
  const prev = decisions[id];
  decisions[id] = { status: to, at: today() };   // 화면은 즉시 바뀐다
  render();
  try {
    await updateJson(FILES.decisions, d => { d[id] = { status: to, at: today() }; }, `inbox: ${action} ${id}`);
    if (action === "add") {
      pending[id] = { at: Date.now() }; savePending();
      const r = await gh("/dispatches", { method: "POST", body: JSON.stringify({ event_type: "inbox_action", client_payload: { id, action: "add" } }) });
      if (r.status !== 204) { let m = ""; try { m = (await r.json()).message || ""; } catch (e) {} throw new Error(`노션 요청 실패 ${r.status}${m ? ": " + m : ""}`); }
      toast("남겼어요. 노션 등록은 30초쯤 걸려요", { label: "되돌리기", fn: () => act(id, "restore", true) });
      pollLinks(id);
    } else if (action === "trash") {
      toast("버렸어요", { label: "되돌리기", fn: () => act(id, "restore", true) });
    } else if (!silent) toast("새로움으로 되돌렸어요");
  } catch (e) {
    if (prev) decisions[id] = prev; else delete decisions[id];
    render(); toast(e.message);
  }
  busy = false;
}

async function retryNotion(id) {
  try {
    pending[id] = { at: Date.now() }; savePending(); render();
    const r = await gh("/dispatches", { method: "POST", body: JSON.stringify({ event_type: "inbox_action", client_payload: { id, action: "add" } }) });
    if (r.status !== 204) throw new Error(`요청 실패 ${r.status}`);
    toast("다시 요청했어요. 30초쯤 뒤에 확인됩니다");
    pollLinks(id);
  } catch (e) { delete pending[id]; savePending(); render(); toast(e.message); }
}

async function pollLinks(id, tries = 12) {
  for (let i = 0; i < tries; i++) {
    await new Promise(r => setTimeout(r, 8000));
    try { links = await readJson(FILES.links, {}); } catch (e) { continue; }
    if (links[id]) { delete pending[id]; savePending(); render(); toast("노션 지원 이력에 들어갔어요"); return; }
  }
}

document.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (document.body.classList.contains("selecting") && card && !e.target.closest("a")) {
    const id = card.dataset.card; picked.has(id) ? picked.delete(id) : picked.add(id); render(); return;
  }
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.act) act(b.dataset.id, b.dataset.act);
  else if (b.dataset.retry) retryNotion(b.dataset.retry);
  else if (b.dataset.open) { const id = b.dataset.open; open.has(id) ? open.delete(id) : open.add(id); render(); }
  else if (b.dataset.status) { statusFilter = b.dataset.status; quick = ""; remember(LS.status, statusFilter); render(); }
  else if (b.dataset.cat) { catFilter = b.dataset.cat; remember(LS.cat, catFilter); render(); }
  else if (b.dataset.quick) { quick = quick === b.dataset.quick ? "" : b.dataset.quick; render(); }
});

// ── 선택 모드 ──
function setSelecting(on) {
  document.body.classList.toggle("selecting", on);
  $("#selectMode").textContent = on ? "☑" : "☐";
  if (!on) picked.clear();
  render();
}
$("#selectMode").onclick = () => setSelecting(!document.body.classList.contains("selecting"));
$("#selCancel").onclick = () => setSelecting(false);
$("#selTrash").onclick = async () => { const ids = [...picked]; setSelecting(false); await actMany(ids, "trash"); };

// ── 스와이프: 왼쪽으로 밀면 버리기, 오른쪽으로 밀면 남기기 ──
(() => {
  let card = null, x0 = 0, y0 = 0, dx = 0, dragging = false;
  const TH = 96;
  document.addEventListener("touchstart", e => {
    const c = e.target.closest(".card"); if (!c || document.body.classList.contains("selecting")) return;
    const it = items.find(i => i.id === c.dataset.card); if (!it || statusOf(it) !== "new") return;
    card = c; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; dragging = false;
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!card) return;
    const x = e.touches[0].clientX - x0, y = e.touches[0].clientY - y0;
    if (!dragging) { if (Math.abs(x) < 10 || Math.abs(y) > Math.abs(x)) { if (Math.abs(y) > 10) card = null; return; } dragging = true; card.classList.add("swiping"); }
    dx = x; card.style.transform = `translateX(${dx}px) rotate(${dx / 60}deg)`;
    card.classList.toggle("show-l", dx < -30); card.classList.toggle("show-r", dx > 30);
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (!card) return;
    const c = card, id = c.dataset.card; card = null;
    c.classList.remove("swiping");
    if (dx <= -TH) { c.classList.add("fly-l"); setTimeout(() => act(id, "trash"), 160); }
    else if (dx >= TH) { c.classList.add("fly-r"); setTimeout(() => act(id, "add"), 160); }
    else { c.style.transform = ""; c.classList.remove("show-l", "show-r"); }
  });
})();

// ── 키보드 (데스크톱) ──
document.addEventListener("keydown", e => {
  if ((e.target.matches && e.target.matches("input, textarea")) || $("#settingsDlg").open) { if (e.key === "Escape" && e.target.blur) e.target.blur(); return; }
  const ids = [...document.querySelectorAll(".card")].map(c => c.dataset.card);
  if (!ids.length && e.key !== "/") return;
  const i = ids.indexOf(focusId);
  const go = n => { focusId = ids[Math.max(0, Math.min(ids.length - 1, n))]; render(); document.querySelector(".card.focused")?.scrollIntoView({ block: "center", behavior: "smooth" }); };
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); go(i < 0 ? 0 : i + 1); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); go(i < 0 ? 0 : i - 1); }
  else if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  else if (focusId && statusFilter === "new") {
    const it = items.find(x => x.id === focusId); if (!it) return;
    if (e.key === "x" || e.key === "Delete") { focusId = ids[Math.min(ids.length - 1, i + 1)] || null; act(it.id, "trash"); }
    else if (e.key === "Enter") { focusId = ids[Math.min(ids.length - 1, i + 1)] || null; act(it.id, "add"); }
    else if (e.key === "o") window.open(it.url, "_blank", "noopener");
    else if (e.key === " ") { e.preventDefault(); open.has(it.id) ? open.delete(it.id) : open.add(it.id); render(); }
  }
});

// ── 자동 새로고침: 5분마다, 그리고 탭으로 돌아왔을 때 ──
let lastLoad = Date.now();
const origLoad = load;
load = async function () { await origLoad(); lastLoad = Date.now(); };
setInterval(() => { if (!document.hidden && !busy && Date.now() - lastLoad > 5 * 60e3) load(); }, 30e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastLoad > 60e3 && !busy) load(); });
$("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
$("#sort").onclick = () => { sortMode = sortMode === "deadline" ? "recent" : "deadline"; remember(LS.sort, sortMode); render(); };
$("#refresh").onclick = () => load();
$("#crawl").onclick = async () => {
  const btn = $("#crawl"); if (btn.classList.contains("spin")) return;
  const before = lastRun, beforeN = items.length;
  try {
    const r = await gh("/dispatches", { method: "POST", body: JSON.stringify({ event_type: "watch_now" }) });
    if (r.status !== 204) throw new Error(`요청 실패 ${r.status}`);
  } catch (e) { toast(e.message); return; }
  btn.classList.add("spin"); toast("게시판 19개를 확인하는 중… 1~2분 걸려요");
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 10000));
    await load();
    if (lastRun && lastRun !== before) { const d = items.length - beforeN; toast(d > 0 ? `새 공고 ${d}건 들어왔어요` : "확인 끝. 새 공고는 없어요"); break; }
  }
  btn.classList.remove("spin");
};
// ── 설정: 어떤 게시판을 어떤 기준으로 보는지 ──
const CATDEF = [
  ["장학", "장학금·장학생 선발. 서울·인천·수도권·전국 대상만, 지방 한정과 대학원은 제외"],
  ["공모전", "논문·정책 제안·아이디어 공모. 사진·영상·디자인 같은 창작물 전용은 제외"],
  ["대외활동", "서포터즈·기자단·아카데미·해외봉사·청년정책 참여단. 대기업·정부부처·공공기관 주최"],
  ["공지", "학교·기관 게시판에서 위 기준에 걸린 글. 분류를 자동으로 못 나눈 것"],
];
async function openSettings() {
  const dlg = $("#settingsDlg"), sheet = $("#sheet");
  sheet.innerHTML = `<div class="head"><h2>설정</h2><button class="iconbtn" id="closeDlg" aria-label="닫기">✕</button></div><p>불러오는 중…</p>`;
  dlg.showModal();
  $("#closeDlg").onclick = () => dlg.close();
  let cfg = null;
  try { cfg = await readJson("state/config.json", null); } catch (e) {}
  const cnt = {}; for (const it of items) cnt[it.source] = (cnt[it.source] || 0) + 1;
  const SETS = {
    esg_climate: "ESG·기후환경 단어", academy: "아카데미·캠프 단어", diplomacy_oda: "공공외교·ODA·해외봉사 단어",
    activity_form: "활동 형태 (서포터즈·기자단·홍보대사·청년정책 참여단 등)", corp: "대기업 이름", gov: "정부부처·공공기관 이름",
    scholarship: "장학 단어", common_exclude: "공통 제외: 채용·입찰·대학원·청소년 대상·창작물 전용 공모·학사 공지",
    local_only: "지방 한정: 서울·인천 외 지역명 (지역 한정 장학 제외용)",
  };
  const sets = cfg?.keyword_sets || {};
  const pill = (w, no) => `<span class="word ${no ? "no" : ""}">${esc(w)}</span>`;
  const group = (list, no) => {
    if (!list || !list.length) return no ? `<span class="word">없음</span>` : `<span class="word">전부 (제목 상관없이)</span>`;
    return list.map(w => {
      if (typeof w === "string" && w.startsWith("$")) {
        const k = w.slice(1), arr = sets[k] || [];
        return `<details class="set"><summary><span class="word ${no ? "no-set" : "yes-set"}">${esc(SETS[k] || k)} · ${arr.length}개 ▾</span></summary><div class="words">${arr.map(x => pill(x, no)).join("")}</div></details>`;
      }
      return pill(w, no);
    }).join("");
  };
  const srcRow = s => `
    <div class="box"><details><summary><div class="t"><span>${esc(s.name)}</span><span class="cat">${esc(s.category)}</span><span class="when">${cnt[s.name] ? `수신함 ${cnt[s.name]}건 · ` : ""}기준 ▾</span></div></summary>
      <div class="words"><span class="lbl">제목에 아래 중 하나가 있으면 가져옴</span>${group(s.keywords_raw ?? s.keywords, false)}</div>
      <div class="words"><span class="lbl">그래도 아래가 있으면 버림</span>${group(s.exclude_raw ?? s.exclude, true)}</div>
      <div class="words"><a class="word" href="${esc(s.url)}" target="_blank" rel="noopener">게시판 열기 ↗</a></div>
    </details></div>`;
  const briefRow = b => `
    <div class="box"><details><summary><div class="t"><span>${esc(b.name)}</span><span class="cat">${esc(b.category)}</span><span class="when">검색 기준 ▾</span></div></summary>
      <pre class="crit">${esc(b.criteria)}</pre></details></div>`;
  const byCat = {};
  for (const s of (cfg?.sources || [])) (byCat[s.category] = byCat[s.category] || []).push(s);
  sheet.innerHTML = `
    <div class="head"><h2>설정</h2><button class="iconbtn" id="closeDlg" aria-label="닫기">✕</button></div>
    <p>등대는 두 가지로 공고를 찾습니다. ① 카톡 루틴과 같은 기준의 웹 검색, ② 주요 게시판 직접 감시. 둘 다 2시간마다 돌고, 한 번 본 공고는 다시 가져오지 않습니다.${cfg ? ` 마지막 확인 ${esc(cfg.checked_at)}.` : ""}</p>
    <h3>분류가 뜻하는 것</h3>
    <div class="box catdef">${CATDEF.map(([c, d]) => `<b>${c}</b><span>${d}</span>`).join("")}</div>
    <h3>① 루틴 기준 웹 검색 ${cfg?.briefs ? cfg.briefs.length + "개" : ""}</h3>
    <p>카톡 루틴에 설정한 검색 기준을 그대로 옮겨, ${esc(String(cfg?.settings?.search_every_hours ?? 2))}시간마다 Google 검색으로 찾습니다. 장학재단·기관 홈페이지처럼 아래 게시판에 없는 곳도 여기서 잡힙니다.</p>
    ${(cfg?.briefs || []).map(briefRow).join("") || "<p>아직 없음</p>"}
    <h3>② 직접 감시하는 게시판 ${cfg ? cfg.sources.length + "개" : ""}</h3>
    <p>새 글을 놓치지 않으려고 아래 게시판은 글 목록을 직접 봅니다. 각 게시판을 누르면 어떤 제목을 가져오고 버리는지 나옵니다.</p>
    ${cfg ? Object.keys(byCat).map(c => `<p style="margin:10px 0 4px"><b>${esc(c)}</b> ${byCat[c].length}</p>` + byCat[c].map(srcRow).join("")).join("")
          : `<p>기준 파일(state/config.json)이 아직 없어요. 봇이 다음에 돌 때 생깁니다.</p>`}
    <h3>기준을 바꾸려면</h3>
    <p>저장소의 <code>watchlist.yml</code> 한 파일입니다. 게시판 추가, 통과·제외 단어 수정 모두 거기서. 바꾸고 싶은 건 Claude에게 제목만 말하면 됩니다.</p>
    <div class="words"><a class="word" href="https://github.com/${OWNER}/${REPO}/blob/main/watchlist.yml" target="_blank" rel="noopener">watchlist.yml 열기 ↗</a><a class="word" href="https://github.com/${OWNER}/${REPO}/actions" target="_blank" rel="noopener">실행 기록 ↗</a></div>
    <h3>이 기기</h3>
    <div class="actions"><button class="ghost" id="resetToken">토큰 지우고 다시 설정</button></div>`;
  $("#closeDlg").onclick = () => dlg.close();
  $("#resetToken").onclick = () => { if (confirm("이 기기에 저장된 GitHub 토큰을 지웁니다. 계속할까요?")) { try { localStorage.removeItem(LS.token); } catch (e) {} dlg.close(); renderSetup(); } };
}
$("#settings").onclick = openSettings;
$("#settingsDlg").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
load();
</script>
</body>
</html>
